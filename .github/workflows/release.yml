name: Create release, push container image

on:
  push:
    tags:
      - "v*"

# Prevent concurrent runs of this workflow, but do not cancel any in-progress
concurrency:
  group: "create-release"
  cancel-in-progress: false

permissions: {}

jobs:
  release:
    name: Create GitHub release
    runs-on: ubuntu-latest

    permissions:
      contents: write
      attestations: write
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Extract version of Go to use
        run: echo "GOVERSION=$(awk -F 'golang:' 'NF>1 {split($2, a, /[-@]/); print a[1]; exit}' Dockerfile)" >> $GITHUB_ENV

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GOVERSION }}
          check-latest: true
          cache: false # avoid cache-poisoning attacks

      # Syft is used by GoReleaser to generate SBOMs
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3

      # Initialize build arguments
      - name: Set build arguments
        run: |
          LDFLAGS=$(make ldflags)
          echo "LDFLAGS=$LDFLAGS" >> $GITHUB_ENV

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LDFLAGS: ${{ env.LDFLAGS }}

      - name: Generate artifact attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            ./dist/rekor-server-*
            ./dist/rekor-cli-*

  build-container:
    name: Build and push container image
    uses: $/.github/workflows/build_container.yml # zizmor: ignore[secrets-inherit]
    secrets: inherit
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

  sign-release:
    name: Sign release with KMS
    runs-on: ubuntu-latest
    needs:
      - release
      - build-container

    permissions:
      contents: write
      packages: write
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: "projects/498091336538/locations/global/workloadIdentityPools/githubactions/providers/sigstore-rekor"
          service_account: "github-actions-rekor@projectsigstore.iam.gserviceaccount.com"

      - name: Log in to the Container registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign release binaries and upload bundles
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TAG: ${{ github.ref_name }}
          KMS_KEY: gcpkms://projects/projectsigstore/locations/global/keyRings/release-cosign/cryptoKeys/cosign/versions/1
        run: |
          mkdir -p dist
          gh release download "${GH_TAG}" \
            --pattern "rekor-server-linux-amd64" \
            --pattern "rekor-server-linux-arm64" \
            --pattern "rekor-server-darwin-amd64" \
            --pattern "rekor-server-darwin-arm64" \
            --pattern "rekor-cli-linux-amd64" \
            --pattern "rekor-cli-linux-arm64" \
            --pattern "rekor-cli-darwin-amd64" \
            --pattern "rekor-cli-darwin-arm64" \
            --dir dist
          for file in dist/rekor-*; do
            cosign sign-blob --yes \
              --bundle "${file}.sigstore.json" \
              --key "${KMS_KEY}" \
              "${file}"
          done
          gh release upload "${GH_TAG}" --clobber dist/*.sigstore.json

      - name: Sign container images with KMS
        env:
          GH_TAG: ${{ github.ref_name }}
          GIT_HASH: ${{ github.sha }}
          SERVER_IMAGE_DIGEST: ${{ needs.build-container.outputs.server-digest }}
          CLI_IMAGE_DIGEST: ${{ needs.build-container.outputs.cli-digest }}
          KMS_KEY: gcpkms://projects/projectsigstore/locations/global/keyRings/release-cosign/cryptoKeys/cosign/versions/1
        run: |
          cosign sign --yes --key "${KMS_KEY}" -a GIT_HASH="${GIT_HASH}" -a GIT_VERSION="${GH_TAG}" "ghcr.io/sigstore/rekor/rekor-server@${SERVER_IMAGE_DIGEST}"
          cosign sign --yes --key "${KMS_KEY}" -a GIT_HASH="${GIT_HASH}" -a GIT_VERSION="${GH_TAG}" "ghcr.io/sigstore/rekor/rekor-cli@${CLI_IMAGE_DIGEST}"

  copy-container:
    name: Copy container image to GCR
    runs-on: ubuntu-latest
    needs:
      - build-container
      - sign-release

    permissions:
      contents: read
      packages: read
      id-token: write

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: "projects/498091336538/locations/global/workloadIdentityPools/githubactions/providers/sigstore-rekor"
          service_account: "github-actions-rekor@projectsigstore.iam.gserviceaccount.com"

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Configure Docker for GCR
        run: gcloud auth configure-docker --quiet

      - name: Log in to the Container registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install ORAS
        uses: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63 # v2.0.3

      - name: Copy images from GHCR to GCR
        env:
          GH_TAG: ${{ github.ref_name }}
        run: |
          oras copy -r "ghcr.io/sigstore/rekor/rekor-server:${GH_TAG}" "gcr.io/projectsigstore/rekor/rekor-server:${GH_TAG}"
          oras copy -r "ghcr.io/sigstore/rekor/rekor-cli:${GH_TAG}" "gcr.io/projectsigstore/rekor/rekor-cli:${GH_TAG}"
          if [[ ! "${GH_TAG}" =~ - ]]; then
            oras tag "gcr.io/projectsigstore/rekor/rekor-server:${GH_TAG}" latest
            oras tag "gcr.io/projectsigstore/rekor/rekor-cli:${GH_TAG}" latest
          fi
